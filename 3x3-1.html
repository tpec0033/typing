<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>羅運 3x3 現場抽籤</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        :root { --primary: #ff8c00; --proxy: #3498db; --bg: #f4f7f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); padding: 15px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; margin-bottom: 12px; font-size: 1rem; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; color: white; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .item { background: white; border: 2px solid #eee; padding: 15px 5px; border-radius: 12px; text-align: center; position: relative; }
        .item.done { border-color: var(--primary); background: #fffcf5; }
        .num { font-size: 1.6rem; font-weight: 800; color: var(--primary); display: block; }
        #results { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; padding: 20px; display: none; }
    </style>
</head>
<body>

<div id="status" style="text-align:center; color:red; font-size:0.8rem; margin-bottom:10px;">連線中...</div>

<div class="card">
    <input type="text" id="pName" placeholder="輸入名字...">
    <div class="btn-group">
        <button class="btn" style="background:var(--primary)" onclick="add(false)">本人報名</button>
        <button class="btn" style="background:var(--proxy)" onclick="add(true)">代抽</button>
    </div>
</div>

<div class="card"><div class="grid" id="list"></div></div>

<div class="btn-group">
    <button class="btn" style="background:#2c3e50; flex:2" onclick="go()">發佈結果</button>
    <button class="btn" style="background:#e74c3c; flex:1" onclick="cls()">清空</button>
</div>

<div id="results">
    <h2 style="text-align:center; color:var(--primary)">🏆 分組結果</h2>
    <div id="res-list" style="margin-top:20px;"></div>
    <button class="btn" style="background:#999; width:100%; margin-top:20px;" onclick="document.getElementById('results').style.display='none'">關閉</button>
</div>

<script>
    const config = {
        apiKey: "AIzaSyBC8pUiQyXSYCfgCCqLyc42FEIWCXCGlJo",
        databaseURL: "https://firebaseio.com",
        projectId: "x3basketball"
    };

    firebase.initializeApp(config);
    const db = firebase.database();

    // 檢查連線
    db.ref(".info/connected").on("value", s => {
        document.getElementById('status').innerText = s.val() ? "● 雲端連線正常" : "○ 連線失敗";
        document.getElementById('status').style.color = s.val() ? "green" : "red";
    });

    function add(isProxy) {
        const n = document.getElementById('pName').value.trim();
        if(n) db.ref('players').push({ name: n, num: null, isProxy, ts: Date.now() });
        document.getElementById('pName').value = '';
    }

    function draw(id, cur) {
        if(cur) return;
        db.ref('players').once('value', s => {
            const all = s.val();
            const used = Object.values(all).map(p => p.num).filter(n => n != null);
            const pool = Array.from({length: Object.keys(all).length}, (_,i)=>i+1).filter(n => !used.includes(n));
            if(pool.length) db.ref('players/'+id).update({ num: pool[Math.floor(Math.random()*pool.length)] });
        });
    }

    db.ref('players').on('value', s => {
        const list = document.getElementById('list');
        list.innerHTML = '';
        if(!s.val()) return;
        Object.entries(s.val()).sort((a,b)=>a[1].ts - b[1].ts).forEach(([id, p]) => {
            const d = document.createElement('div');
            d.className = `item ${p.num?'done':''}`;
            d.onclick = () => draw(id, p.num);
            d.innerHTML = `<span class="num">${p.num||'?'}</span><span style="font-size:0.8rem">${p.isProxy?'[代]':''}${p.name}</span>`;
            list.appendChild(d);
        });
    });

    db.ref('res').on('value', s => {
        const r = document.getElementById('results');
        if(!s.val()) { r.style.display='none'; return; }
        r.style.display='block';
        document.getElementById('res-list').innerHTML = s.val().map((t,i)=>`<div style="border:1px solid orange; padding:10px; margin-bottom:10px; border-radius:8px;"><b>TEAM ${i+1}</b><br>${t.join('、')}</div>`).join('');
    });

    function go() {
        db.ref('players').once('value', s => {
            const p = Object.values(s.val()||{}).filter(x=>x.num).sort((a,b)=>a.num-b.num);
            const ts = [];
            for(let i=0; i<p.length; i+=3) ts.push(p.slice(i, i+3).map(x=>x.name));
            db.ref('res').set(ts);
        });
    }
    function cls() { if(confirm('重設？')) db.ref('/').remove(); }
</script>
</body>
</html>
