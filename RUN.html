<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運動會賽跑計時排名</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--field:#f1f4f9;--text:#0f172a;--muted:#94a3b8;--line:#e6eaf1;--navy:#0f1b3d;--navy2:#1e3a8a;--accent:#2f6bff;--accent-soft:#e8efff;--red:#e11d48;--redbg:#ffe4ea;
--g1:#fff3c4;--g1b:#f2b705;--g2:#eaeef5;--g2b:#9aa7bb;--g3:#fde7d6;--g3b:#cd7f3e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1d;--card:#131a2d;--field:#1c2540;--text:#eef2ff;--muted:#7e8bab;--line:#222c48;--accent:#5b8cff;--accent-soft:#1a2a52;--red:#fb7185;--redbg:#471525;--g1:#3d3414;--g2:#262e44;--g3:#3b2a1b}}
:root[data-theme="dark"]{--bg:#0a0f1d;--card:#131a2d;--field:#1c2540;--text:#eef2ff;--muted:#7e8bab;--line:#222c48;--accent:#5b8cff;--accent-soft:#1a2a52;--red:#fb7185;--redbg:#471525;--g1:#3d3414;--g2:#262e44;--g3:#3b2a1b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 14px 40px}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:20px;padding:18px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:.04em}
.top p{margin:3px 0 0;font-size:.78rem;opacity:.7}
.sw{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;cursor:pointer;user-select:none}
.sw input{display:none}
.track{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.25);position:relative;transition:.2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+.track{background:var(--accent)}
.sw input:checked+.track::after{left:21px}
.card{background:var(--card);border-radius:20px;padding:8px 12px 12px;box-shadow:0 4px 18px rgba(15,27,61,.07)}
.lr{display:flex;align-items:center;gap:6px;padding:5px 0}
.hd{padding:8px 0 2px;color:var(--muted);font-size:.78rem;font-weight:700;text-align:center}
.hd span{min-width:0}
.bd{width:34px;height:34px;flex:none;border-radius:50%;background:var(--field);color:var(--muted);font-weight:800;display:grid;place-items:center;transition:.15s}
.hd .bd{visibility:hidden}
.lane.on .bd{background:var(--accent);color:#fff}
.mi{flex:.75}.fs{flex:1}
.lr input{width:100%;min-width:0;height:52px;font-size:1.65rem;font-weight:700;text-align:center;border:2px solid transparent;border-radius:14px;background:var(--field);color:var(--text);font-variant-numeric:tabular-nums;padding:0}
.lr input::placeholder{color:var(--muted);opacity:.5}
.lr input:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px var(--accent-soft)}
.sp{width:8px;flex:none;text-align:center;color:var(--muted);font-weight:800;font-size:1.2rem}
.hide{display:none!important}
.lane.dup input{color:var(--red);border-color:var(--red);background:var(--redbg)}
.lane.dup .bd{background:var(--red);color:#fff}
h2{font-size:1rem;margin:24px 4px 10px;font-weight:800;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;margin-bottom:10px;background:var(--card);box-shadow:0 3px 12px rgba(15,27,61,.06)}
.row.r1{background:var(--g1)}.row.r2{background:var(--g2)}.row.r3{background:var(--g3)}
.medal{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:var(--muted);background:var(--field)}
.r1 .medal{background:var(--g1b);color:#fff}.r2 .medal{background:var(--g2b);color:#fff}.r3 .medal{background:var(--g3b);color:#fff}
.lb{font-weight:800;font-size:1.05rem}
.lb small{display:block;color:var(--muted);font-weight:600;font-size:.72rem;margin-top:1px}
.tm{margin-left:auto;text-align:right}
.t{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.r1 .t{color:#92400e}
.row.dup{background:var(--redbg)}
.row.dup .t,.row.dup .lb{color:var(--red)}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:99px;margin-right:6px;vertical-align:1px}
.empty{color:var(--muted);text-align:center;padding:26px 0;background:var(--card);border-radius:18px;font-size:.9rem}
button{margin-top:26px;width:100%;height:50px;font-size:1rem;border:0;border-radius:14px;background:var(--field);color:var(--muted);font-weight:700}
button:active{background:var(--redbg);color:var(--red)}
</style>
</head>
<body>
<main>
<div class="top">
  <div><h1>賽跑計時排名</h1><p>8 跑道 · 自動排序</p></div>
  <label class="sw"><input type="checkbox" id="useMin" checked><span class="track"></span>計算分</label>
</div>

<div class="card">
  <div class="lr hd"><div class="bd"></div>
    <span class="mi mf">分</span><b class="sp mf"></b><span class="fs">秒</span><b class="sp"></b><span class="fs">百分秒</span></div>
  <div id="inputs"></div>
</div>

<h2>名次</h2>
<div id="rank"></div>

<button id="clear">清除全部</button>
</main>

<script>
const N=8,MKEY="race-use-min";
const $=id=>document.getElementById(id);
let useMin=true;
try{useMin=localStorage.getItem(MKEY)!=="0"}catch(e){}
$("useMin").checked=useMin;

const box=$("inputs");
for(let i=1;i<=N;i++){
  const d=document.createElement("div");d.className="lr lane";d.id="lane"+i;
  d.innerHTML=`<div class="bd">${i}</div>
  <input class="mi mf" id="m${i}" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="0" enterkeyhint="next" aria-label="第${i}道 分">
  <b class="sp mf">:</b>
  <input class="fs" id="s${i}" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="00" enterkeyhint="next" aria-label="第${i}道 秒">
  <b class="sp">.</b>
  <input class="fs" id="c${i}" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="00" enterkeyhint="next" aria-label="第${i}道 百分秒">`;
  box.appendChild(d);
}
function fields(){
  const a=[];
  for(let i=1;i<=N;i++){if(useMin)a.push($("m"+i));a.push($("s"+i));a.push($("c"+i))}
  return a;
}
function next(el){
  const f=fields(),k=f.indexOf(el);
  if(k>=0&&k<f.length-1){f[k+1].focus();f[k+1].select()}
}
function applyMode(){
  document.querySelectorAll(".mf").forEach(e=>e.classList.toggle("hide",!useMin));
  render();
}
box.addEventListener("input",e=>{
  const el=e.target,type=el.id[0];
  let v=el.value.replace(/\D/g,"").slice(0,type==="m"?1:2);
  if(type==="s"&&v.length===2&&+v>59)v="59";
  el.value=v;
  if(type==="m"&&v.length===1)next(el);
  else if(type==="s"){if(v.length===2||(v.length===1&&+v>=6))next(el)}
  else if(type==="c"&&v.length===2)next(el);
  render();
});
box.addEventListener("keydown",e=>{
  const el=e.target,f=fields(),k=f.indexOf(el);
  if(e.key==="Enter"){e.preventDefault();next(el)}
  if(e.key==="Backspace"&&el.value===""&&k>0)f[k-1].focus();
});
box.addEventListener("focusin",e=>e.target.select&&e.target.select());
$("useMin").onchange=e=>{useMin=e.target.checked;try{localStorage.setItem(MKEY,useMin?"1":"0")}catch(x){}applyMode()};

function readLane(i){
  const m=useMin?$("m"+i).value:"",s=$("s"+i).value,c=$("c"+i).value;
  if(m===""&&s===""&&c==="")return null;
  return (+m||0)*6000+(+s||0)*100+(+c||0);
}
function fmt(t){
  const s=Math.floor(t/100),c=String(t%100).padStart(2,"0");
  if(useMin)return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}.${c}`;
  return `${s}.${c}`;
}
function rankOf(list){
  const cnt={};list.forEach(x=>cnt[x.t]=(cnt[x.t]||0)+1);
  const sorted=[...list].sort((a,b)=>a.t-b.t||a.lane-b.lane);
  let rank=0,prev=null;
  return sorted.map((x,i)=>{if(x.t!==prev){rank=i+1;prev=x.t}return {...x,rank,dup:cnt[x.t]>1}});
}
function current(){
  const l=[];for(let i=1;i<=N;i++){const t=readLane(i);if(t!==null)l.push({lane:i,t})}return l;
}
function render(){
  const rows=rankOf(current());
  for(let i=1;i<=N;i++){
    const r=rows.find(x=>x.lane===i);
    const el=$("lane"+i);
    el.classList.toggle("dup",!!(r&&r.dup));
    el.classList.toggle("on",!!r);
  }
  if(!rows.length){$("rank").innerHTML='<div class="empty">輸入成績後，名次會自動排在這裡</div>';return}
  const best=rows[0].t;
  $("rank").innerHTML=rows.map(r=>`<div class="row ${r.rank<=3?'r'+r.rank:''} ${r.dup?'dup':''}">
    <div class="medal">${r.rank}</div>
    <div class="lb">第 ${r.lane} 道<small>${r.dup?'<span class="tag">同分</span>':''}${r.t===best?'最快':'+'+((r.t-best)/100).toFixed(2)+' 秒'}</small></div>
    <div class="tm"><div class="t">${fmt(r.t)}</div></div>
  </div>`).join("");
}
$("clear").onclick=()=>{
  if(!confirm("確定要清除所有跑道的成績嗎？清除後無法復原。"))return;
  box.querySelectorAll("input").forEach(i=>i.value="");render();
  window.scrollTo({top:0,behavior:"smooth"});
};
applyMode();
</script>
</body>
</html>
